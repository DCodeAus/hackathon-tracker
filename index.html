<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build Days Hackathons</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f0f1e;
            min-height: 100vh;
            padding: 2rem 1rem;
            color: #e0e0e0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: #ff006e;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
            color: #ff006e;
            text-shadow: 0 0 10px rgba(255, 0, 110, 0.5);
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.85;
            color: #00d9ff;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #ff006e;
            color: #0f0f1e;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.6);
        }

        .btn-secondary {
            background: rgba(0, 217, 255, 0.2);
            color: #00d9ff;
            border: 2px solid #00d9ff;
        }

        .btn-secondary:hover {
            background: rgba(0, 217, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.4);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 15, 30, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a2e;
            padding: 2rem;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 0 30px rgba(255, 0, 110, 0.3);
            border: 1px solid #ff006e;
        }

        .modal-header {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #ff006e;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #00d9ff;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #39ff14;
            background: #0f0f1e;
            color: #e0e0e0;
            border-radius: 6px;
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #ff006e;
            box-shadow: 0 0 10px rgba(255, 0, 110, 0.3);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .form-actions button {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit {
            background: linear-gradient(135deg, #ff006e 0%, #ffa500 100%);
            color: #0f0f1e;
        }

        .btn-submit:hover {
            opacity: 0.9;
            box-shadow: 0 0 15px rgba(255, 0, 110, 0.5);
        }

        .btn-cancel {
            background: #39ff14;
            color: #0f0f1e;
        }

        .btn-cancel:hover {
            background: #00d9ff;
            color: #0f0f1e;
        }

        .section {
            margin-bottom: 3rem;
        }

        .section-title {
            font-size: 1.8rem;
            color: #00d9ff;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 3px solid #ff006e;
        }

        .events-grid {
            display: grid;
            gap: 1.5rem;
        }

        .event-card {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            border: 1px solid #39ff14;
        }

        .event-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 30px rgba(255, 0, 110, 0.4);
            border-color: #ff006e;
        }

        .event-card.upcoming {
            border-left: 5px solid #ff006e;
        }

        .event-card.past {
            border-left: 5px solid #39ff14;
            opacity: 0.7;
        }

        .event-card.featured {
            border: 2px solid #ffa500;
            box-shadow: 0 0 25px rgba(255, 165, 0, 0.5);
            animation: featured-pulse 2.5s ease-in-out infinite;
        }

        .event-card.featured:hover {
            border-color: #ffa500;
            box-shadow: 0 0 35px rgba(255, 165, 0, 0.7);
        }

        @keyframes featured-pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 165, 0, 0.4); }
            50% { box-shadow: 0 0 35px rgba(255, 165, 0, 0.8); }
        }

        .featured-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ffa500 0%, #ff006e 100%);
            color: #0f0f1e;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 0.4rem 1rem;
            border-radius: 6px;
            margin-bottom: 0.75rem;
        }

        .tag.byod {
            background: rgba(255, 165, 0, 0.15);
            color: #ffa500;
            border-color: #ffa500;
            font-weight: 600;
        }

        .event-actions {
            position: absolute;
            top: 1rem;
            right: 1rem;
            display: flex;
            gap: 0.5rem;
        }

        .event-edit, .event-delete {
            background: #00d9ff;
            color: #0f0f1e;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: all 0.3s;
        }

        .event-edit:hover {
            background: #39ff14;
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.5);
        }

        .event-delete {
            background: #ff006e;
        }

        .event-delete:hover {
            background: #ffa500;
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(255, 0, 110, 0.5);
        }

        .event-header {
            margin-bottom: 1rem;
            padding-right: 3rem;
        }

        .event-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: #00d9ff;
            margin-bottom: 0.5rem;
        }

        .event-date {
            font-size: 0.95rem;
            color: #39ff14;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .event-date::before {
            content: '📅';
        }

        .past .event-date {
            color: #39ff14;
        }

        .event-location {
            font-size: 0.95rem;
            color: #ff006e;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .event-location::before {
            content: '📍';
        }

        .event-description {
            color: #b0b0b0;
            font-size: 0.95rem;
            line-height: 1.5;
            margin: 1rem 0;
        }

        .event-link {
            display: inline-block;
            background: linear-gradient(135deg, #ff006e 0%, #ffa500 100%);
            color: #0f0f1e;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 500;
            transition: opacity 0.3s ease;
            margin-top: 1rem;
        }

        .event-link:hover {
            opacity: 0.9;
            box-shadow: 0 0 15px rgba(255, 0, 110, 0.5);
        }

        .empty-state {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            color: #666;
            font-size: 1.1rem;
            border: 1px dashed #39ff14;
        }

        .tag {
            display: inline-block;
            background: rgba(0, 217, 255, 0.1);
            color: #00d9ff;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            margin-right: 0.5rem;
            border: 1px solid #00d9ff;
        }

        .tag.ai {
            background: rgba(255, 0, 110, 0.1);
            color: #ff006e;
            border-color: #ff006e;
        }

        .tag.startup {
            background: rgba(57, 255, 20, 0.1);
            color: #39ff14;
            border-color: #39ff14;
        }

        .tag.building {
            background: rgba(255, 165, 0, 0.1);
            color: #ffa500;
            border-color: #ffa500;
        }

        .tag.competition {
            background: rgba(0, 217, 255, 0.1);
            color: #00d9ff;
            border-color: #00d9ff;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 1.8rem;
            }

            .section-title {
                font-size: 1.4rem;
            }

            .event-title {
                font-size: 1.2rem;
            }

            .controls {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Build Days Hackathons</h1>
            <p>Discover upcoming and past hackathon events</p>
        </header>

        <div class="controls">
            <button class="btn btn-primary" onclick="openAddEventModal()">+ Add Event</button>
            <button class="btn btn-secondary" onclick="showDataModal()">💾 View Data</button>
        </div>

        <!-- UPCOMING EVENTS -->
        <section class="section">
            <h2 class="section-title">🔥 Upcoming Events</h2>
            <div class="events-grid" id="upcomingEvents"></div>
        </section>

        <!-- PAST EVENTS -->
        <section class="section">
            <h2 class="section-title">✅ Past Events</h2>
            <div class="events-grid" id="pastEvents"></div>
        </section>
    </div>

    <!-- ADD EVENT MODAL -->
    <div class="modal" id="addEventModal">
        <div class="modal-content">
            <div class="modal-header">Add New Event</div>
            <form onsubmit="addEvent(event)">
                <div class="form-group">
                    <label for="title">Event Title *</label>
                    <input type="text" id="title" required>
                </div>

                <div class="form-group">
                    <label for="date">Date *</label>
                    <input type="text" id="date" placeholder="e.g., 15 July 2024" required>
                </div>

                <div class="form-group">
                    <label for="location">Location *</label>
                    <input type="text" id="location" placeholder="e.g., Melbourne VIC" required>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" placeholder="Brief description of the event"></textarea>
                </div>

                <div class="form-group">
                    <label for="link">Event Link</label>
                    <input type="url" id="link" placeholder="https://...">
                </div>

                <div class="form-group">
                    <label for="status">Status *</label>
                    <select id="status">
                        <option value="upcoming">Upcoming</option>
                        <option value="past">Past</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="tags">Tags (comma-separated)</label>
                    <input type="text" id="tags" placeholder="e.g., AI, Building, Startup">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit">Add Event</button>
                    <button type="button" class="btn-cancel" onclick="closeAddEventModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- EDIT EVENT MODAL -->
    <div class="modal" id="editEventModal">
        <div class="modal-content">
            <div class="modal-header">Edit Event</div>
            <form onsubmit="updateEvent(event)">
                <div class="form-group">
                    <label for="editTitle">Event Title *</label>
                    <input type="text" id="editTitle" required>
                </div>

                <div class="form-group">
                    <label for="editDate">Date *</label>
                    <input type="text" id="editDate" placeholder="e.g., 15 July 2024" required>
                </div>

                <div class="form-group">
                    <label for="editLocation">Location *</label>
                    <input type="text" id="editLocation" placeholder="e.g., Melbourne VIC" required>
                </div>

                <div class="form-group">
                    <label for="editDescription">Description</label>
                    <textarea id="editDescription" placeholder="Brief description of the event"></textarea>
                </div>

                <div class="form-group">
                    <label for="editLink">Event Link</label>
                    <input type="url" id="editLink" placeholder="https://...">
                </div>

                <div class="form-group">
                    <label for="editStatus">Status *</label>
                    <select id="editStatus">
                        <option value="upcoming">Upcoming</option>
                        <option value="past">Past</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="editTags">Tags (comma-separated)</label>
                    <input type="text" id="editTags" placeholder="e.g., AI, Building, Startup">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit">Save Changes</button>
                    <button type="button" class="btn-cancel" onclick="closeEditEventModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- DATA VIEW MODAL -->
    <div class="modal" id="dataModal">
        <div class="modal-content">
            <div class="modal-header">Event Data (JSON)</div>
            <p style="color: #666; margin-bottom: 1rem;">Copy this to save your events. Paste it back to restore them.</p>
            <textarea id="dataTextarea" style="width: 100%; height: 300px; padding: 1rem; border: 2px solid #e0e0e0; border-radius: 6px; font-family: monospace; font-size: 0.9rem; background: #0f0f1e; color: #e0e0e0;" readonly></textarea>
            <div class="form-actions">
                <button class="btn-submit" onclick="copyData()" style="flex: 1; padding: 0.75rem;">📋 Copy to Clipboard</button>
                <button class="btn-cancel" onclick="closeDataModal()" style="flex: 1; padding: 0.75rem;">Close</button>
            </div>
        </div>
    </div>

    <script>
        // ===== EVENT DATA =====
        let events = [];

        // Load events from JSON file (source of truth)
        async function loadEventsFromJSON() {
            try {
                const response = await fetch('/hackathon-tracker/events.json');
                if (!response.ok) throw new Error('Failed to load events.json');
                events = applyLocalChanges(await response.json());
                renderEvents();
            } catch (error) {
                console.error('Error loading events:', error);
                document.getElementById('upcomingEvents').innerHTML = '<div class="empty-state">Error loading events. Please refresh the page.</div>';
            }
        }

        // ===== LOCAL CHANGES =====
        // Only this browser's adds, edits and deletes are stored, and they're
        // laid over events.json on every load. That way edits survive a
        // refresh and new events published to events.json still show up.
        const LOCAL_CHANGES_KEY = 'hackathonLocalChanges';

        function readLocalChanges() {
            try {
                const saved = JSON.parse(localStorage.getItem(LOCAL_CHANGES_KEY));
                if (saved && saved.upserts && Array.isArray(saved.deleted)) return saved;
            } catch (e) { /* storage blocked or bad data: start fresh */ }
            return { upserts: {}, deleted: [] };
        }

        function writeLocalChanges(changes) {
            try {
                localStorage.setItem(LOCAL_CHANGES_KEY, JSON.stringify(changes));
                localStorage.removeItem('hackathonEvents'); // old key, never read back
            } catch (e) { /* storage blocked: changes last until refresh */ }
        }

        function applyLocalChanges(baseEvents) {
            const changes = readLocalChanges();
            const merged = baseEvents.filter(e => !changes.deleted.includes(e.id));
            Object.values(changes.upserts).forEach(local => {
                if (changes.deleted.includes(local.id)) return;
                const i = merged.findIndex(e => e.id === local.id);
                if (i === -1) merged.push(local);
                else merged[i] = local;
            });
            return merged;
        }

        // Record an added or edited event, then redraw
        function saveEvent(event) {
            const changes = readLocalChanges();
            changes.upserts[event.id] = event;
            writeLocalChanges(changes);
            renderEvents();
        }

        // Record a deleted event, then redraw
        function saveDeletion(id) {
            const changes = readLocalChanges();
            delete changes.upserts[id];
            if (!changes.deleted.includes(id)) changes.deleted.push(id);
            writeLocalChanges(changes);
            renderEvents();
        }

        // Reads the first and last day out of a date as people write it -
        // "Saturday 18 July 9:00AM - 1:00 PM AEST", "Friday 4 - Saturday 5
        // December 2026", "13 February 2027" - and returns both as YYYY-MM-DD
        // (end is null for a one-day event). Times like 9:00AM are ignored.
        // With no year in the text, fallbackYear is used if given (editing an
        // existing event keeps its year); otherwise it's the next time that
        // date comes round, so typing "13 February" in October means next
        // February rather than one that's already been.
        function parseDateRange(dateStr, fallbackYear) {
            if (!dateStr) return null;

            // If already in YYYY-MM-DD format
            if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr.trim())) {
                return { start: dateStr.trim(), end: null };
            }

            const months = {
                'january': 1, 'february': 2, 'march': 3, 'april': 4, 'may': 5, 'june': 6,
                'july': 7, 'august': 8, 'september': 9, 'october': 10, 'november': 11, 'december': 12
            };
            const monthHits = [...dateStr.matchAll(/\b(january|february|march|april|may|june|july|august|september|october|november|december)\b/gi)]
                .map(m => ({ month: months[m[1].toLowerCase()], at: m.index }));
            // Day numbers: one or two digits on their own - not part of a time
            // (9:00, 5:30) or a year (2026).
            const dayHits = [...dateStr.matchAll(/(?<![:\d])\b(\d{1,2})(?:st|nd|rd|th)?\b(?![:\d])/g)]
                .map(m => ({ day: Number(m[1]), at: m.index }))
                .filter(d => d.day >= 1 && d.day <= 31);
            if (monthHits.length === 0 || dayHits.length === 0) return null;

            // Each day belongs to the first month written after it (or the
            // last month in the text, if none follows).
            const monthFor = at => (monthHits.find(m => m.at > at) || monthHits[monthHits.length - 1]).month;
            const first = { day: dayHits[0].day, month: monthFor(dayHits[0].at) };
            const lastHit = dayHits[dayHits.length - 1];
            const last = { day: lastHit.day, month: monthFor(lastHit.at) };

            const yearMatch = dateStr.match(/\b(20\d{2})\b/);
            let year;
            if (yearMatch) {
                year = Number(yearMatch[1]);
            } else if (fallbackYear) {
                year = fallbackYear;
            } else {
                const now = new Date();
                year = now.getFullYear();
                if (first.month < now.getMonth() + 1) year++;
            }
            // A range written with one year at the end ("28 December - 2
            // January 2027") - the year belongs to the end of it.
            let startYear = year, endYear = year;
            if (last.month < first.month) {
                if (yearMatch) startYear = year - 1; else endYear = year + 1;
            }

            const iso = (y, d) => `${y}-${String(d.month).padStart(2, '0')}-${String(d.day).padStart(2, '0')}`;
            const start = iso(startYear, first);
            const end = iso(endYear, last);
            return { start, end: end === start ? null : end };
        }

        function parseDateToISO(dateStr, fallbackYear) {
            const range = parseDateRange(dateStr, fallbackYear);
            return range ? range.start : null;
        }

        // Work out upcoming/past from the date so events roll over on their own.
        // Uses endDate for multi-day events, then sortDate, then the stored status.
        function eventStatus(event) {
            const lastDay = event.endDate || event.sortDate;
            if (!lastDay) return event.status;
            const now = new Date();
            const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            return lastDay < today ? 'past' : 'upcoming';
        }

        // Render all events (sorted chronologically)
        function renderEvents() {
            const upcomingContainer = document.getElementById('upcomingEvents');
            const pastContainer = document.getElementById('pastEvents');

            upcomingContainer.innerHTML = '';
            pastContainer.innerHTML = '';

            const upcoming = events.filter(e => eventStatus(e) === 'upcoming');
            const past = events.filter(e => eventStatus(e) === 'past');

            // Sort chronologically (earliest first for upcoming, latest first for past)
            upcoming.sort((a, b) => {
                const dateA = a.sortDate ? new Date(a.sortDate) : new Date(0);
                const dateB = b.sortDate ? new Date(b.sortDate) : new Date(0);
                return dateA - dateB;
            });
            past.sort((a, b) => {
                const dateA = a.sortDate ? new Date(a.sortDate) : new Date(0);
                const dateB = b.sortDate ? new Date(b.sortDate) : new Date(0);
                return dateB - dateA;
            });

            if (upcoming.length === 0) {
                upcomingContainer.innerHTML = '<div class="empty-state">No upcoming events yet.</div>';
            } else {
                upcoming.forEach(event => {
                    upcomingContainer.appendChild(createEventCard(event));
                });
            }

            if (past.length === 0) {
                pastContainer.innerHTML = '<div class="empty-state">No past events yet. Check back after events finish!</div>';
            } else {
                past.forEach(event => {
                    pastContainer.appendChild(createEventCard(event));
                });
            }
        }

        // Create event card HTML
        function createEventCard(event) {
            const card = document.createElement('div');
            card.className = `event-card ${eventStatus(event)}${event.featured ? ' featured' : ''}`;

            const tagsHTML = event.tags.map(tag => `<span class="tag">${tag}</span>`).join('');
            const byodLabel = event.byod === 'required' ? '💻 BYOD – bring a laptop'
                : event.byod === 'optional' ? '💻 BYOD optional'
                : null;
            const byodHTML = byodLabel ? `<span class="tag byod">${byodLabel}</span>` : '';
            const linkHTML = event.link ? `<a href="${event.link}" class="event-link" target="_blank">View Event →</a>` : '';
            const featuredHTML = event.featured ? `<div class="featured-badge">⭐ Important – Official Event ⭐</div>` : '';

            card.innerHTML = `
                <div class="event-actions">
                    <button class="event-edit" onclick="openEditEventModal(${event.id})" title="Edit event">✏️</button>
                    <button class="event-delete" onclick="deleteEvent(${event.id})" title="Delete event">×</button>
                </div>
                ${featuredHTML}
                <div class="event-header">
                    <h3 class="event-title">${event.title}</h3>
                    <div class="event-date">${event.date}</div>
                    <div class="event-location">${event.location}</div>
                </div>
                <p class="event-description">${event.description}</p>
                <div>${tagsHTML}${byodHTML}</div>
                ${linkHTML}
            `;

            return card;
        }

        // Add event from form
        function addEvent(e) {
            e.preventDefault();

            const dateInput = document.getElementById('date').value;
            const range = parseDateRange(dateInput);
            const sortDate = range ? range.start : new Date().toISOString().split('T')[0];

            const newEvent = {
                id: Date.now(),
                title: document.getElementById('title').value,
                date: dateInput,
                sortDate: sortDate,
                location: document.getElementById('location').value,
                description: document.getElementById('description').value,
                link: document.getElementById('link').value,
                status: document.getElementById('status').value,
                tags: document.getElementById('tags').value.split(',').map(t => t.trim()).filter(t => t)
            };

            // Multi-day events stay "upcoming" until their last day.
            if (range && range.end) newEvent.endDate = range.end;

            events.push(newEvent);
            saveEvent(newEvent);
            closeAddEventModal();
        }

        // Delete event
        function deleteEvent(id) {
            if (confirm('Delete this event?')) {
                events = events.filter(e => e.id !== id);
                saveDeletion(id);
            }
        }

        // Modal functions
        function openAddEventModal() {
            document.getElementById('addEventModal').classList.add('active');
        }

        function closeAddEventModal() {
            document.getElementById('addEventModal').classList.remove('active');
            document.getElementById('title').value = '';
            document.getElementById('date').value = '';
            document.getElementById('location').value = '';
            document.getElementById('description').value = '';
            document.getElementById('link').value = '';
            document.getElementById('tags').value = '';
        }

        function openEditEventModal(id) {
            const event = events.find(e => e.id === id);
            if (!event) return;

            document.getElementById('editTitle').value = event.title;
            document.getElementById('editDate').value = event.date;
            document.getElementById('editLocation').value = event.location;
            document.getElementById('editDescription').value = event.description;
            document.getElementById('editLink').value = event.link;
            document.getElementById('editStatus').value = event.status;
            document.getElementById('editTags').value = event.tags.join(', ');
            
            document.getElementById('editEventModal').dataset.editId = id;
            document.getElementById('editEventModal').classList.add('active');
        }

        function closeEditEventModal() {
            document.getElementById('editEventModal').classList.remove('active');
        }

        function updateEvent(e) {
            e.preventDefault();

            const id = parseInt(document.getElementById('editEventModal').dataset.editId);
            const eventIndex = events.findIndex(ev => ev.id === id);
            const dateInput = document.getElementById('editDate').value;
            // A date typed without a year keeps the event's existing year.
            const existing = events[eventIndex];
            const existingYear = existing && existing.sortDate ? Number(existing.sortDate.slice(0, 4)) : null;
            const range = parseDateRange(dateInput, existingYear);
            // A date that can't be read ("Early October, TBA") keeps the date
            // the event already had.
            const sortDate = range ? range.start : (existing && existing.sortDate) || new Date().toISOString().split('T')[0];

            if (eventIndex !== -1) {
                // Start from the existing event so fields the form doesn't
                // show (like the bring-your-own-laptop badge) are kept.
                events[eventIndex] = {
                    ...existing,
                    id: id,
                    title: document.getElementById('editTitle').value,
                    date: dateInput,
                    sortDate: sortDate,
                    location: document.getElementById('editLocation').value,
                    description: document.getElementById('editDescription').value,
                    link: document.getElementById('editLink').value,
                    status: document.getElementById('editStatus').value,
                    tags: document.getElementById('editTags').value.split(',').map(t => t.trim()).filter(t => t)
                };
                if (range && range.end) events[eventIndex].endDate = range.end;
                else delete events[eventIndex].endDate;

                saveEvent(events[eventIndex]);
                closeEditEventModal();
            }
        }

        function showDataModal() {
            document.getElementById('dataTextarea').value = JSON.stringify(events, null, 2);
            document.getElementById('dataModal').classList.add('active');
        }

        function closeDataModal() {
            document.getElementById('dataModal').classList.remove('active');
        }

        function copyData() {
            const textarea = document.getElementById('dataTextarea');
            textarea.select();
            document.execCommand('copy');
            alert('Copied to clipboard! ');
        }

        // Close modals on background click
        window.onclick = function(event) {
            const addModal = document.getElementById('addEventModal');
            const editModal = document.getElementById('editEventModal');
            const dataModal = document.getElementById('dataModal');
            
            if (event.target === addModal) closeAddEventModal();
            if (event.target === editModal) closeEditEventModal();
            if (event.target === dataModal) closeDataModal();
        }

        // Initialize: Load from JSON (source of truth)
        loadEventsFromJSON();
    </script>
</body>
</html>
